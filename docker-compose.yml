services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: alfred
      POSTGRES_DB: alfred
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "alfred"]
      interval: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://alfred:${POSTGRES_PASSWORD}@db:5432/alfred
    ports:
      - "127.0.0.1:${PORT:-8100}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
